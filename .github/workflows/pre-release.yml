name: Pre-release Build

on:
  # Auto build DMG for PRs
  pull_request:
    branches: [main]
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Get version from latest tag
        id: version
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          BASE_VERSION="${LATEST_TAG#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"
          VERSION="${BASE_VERSION}-pre.${BUILD_NUM}.${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pre-release version: $VERSION"

      - name: Build Release
        run: |
          xcodebuild -scheme ZendyKey -configuration Release build \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/ZendyKey.app"
          V="${{ steps.version.outputs.version }}"
          DMG_NAME="ZendyKey-${V}.dmg"
          
          # Update version in app
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$APP_PATH/Contents/Info.plist"
          
          # Create DMG folder
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          # Create DMG
          hdiutil create -volname "ZendyKey" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "$DMG_NAME"
          
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZendyKey-${{ steps.version.outputs.version }}
          path: "*.dmg"
          retention-days: 14

      - name: Comment on PR with artifact link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const shortSha = process.env.COMMIT_SHA.substring(0, 7);
            const version = process.env.VERSION;
            const prNumber = process.env.PR_NUMBER;
            const runId = process.env.RUN_ID;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            
            const body = [
              '## 📦 Pre-release Build Ready',
              '',
              '| Commit | Version | Download |',
              '|--------|---------|----------|',
              `| \`${shortSha}\` | \`${version}\` | [⬇️ **ZendyKey-${version}.zip**](${artifactUrl}#artifacts) |`,
              '',
              `> 🔗 Build for commit ${process.env.COMMIT_SHA}`,
              `> 📁 Artifact expires in 14 days`
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body
            });
