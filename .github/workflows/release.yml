name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building ZendyKey version: $VERSION"

      - name: Get previous tag
        id: prev_tag
        run: |
          # Get previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "📋 Previous tag: $PREV_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.PREV_TAG }}"
          
          echo "📝 Generating changelog..."
          
          if [ -n "$PREV_TAG" ]; then
            # Get commits between previous tag and current
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "")
          else
            # First release - get recent commits
            CHANGELOG=$(git log -20 --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "")
          fi
          
          # Output changelog
          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build Release
        run: |
          echo "🔨 Building ZendyKey..."
          xcodebuild -scheme ZendyKey -configuration Release \
            -derivedDataPath build/DerivedData \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "✅ Build completed!"

      - name: Update version in app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/ZendyKey.app"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP_PATH/Contents/Info.plist"
          
          echo "📝 Updated app version to $VERSION"

      - name: Create DMG
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APP_PATH="build/DerivedData/Build/Products/Release/ZendyKey.app"
          DMG_NAME="ZendyKey-${VERSION}.dmg"
          
          echo "📦 Creating DMG installer..."
          
          # Create temp directory
          STAGING_DIR=$(mktemp -d)
          
          # Copy app
          cp -R "$APP_PATH" "$STAGING_DIR/"
          
          # Remove ALL extended attributes (including quarantine)
          xattr -cr "$STAGING_DIR/ZendyKey.app" 2>/dev/null || true
          
          # Create Applications symlink
          ln -s /Applications "$STAGING_DIR/Applications"
          
          # Create DMG
          hdiutil create -volname "ZendyKey" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_NAME"
          
          # Generate checksum
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          
          # Store checksum in env for release notes
          echo "CHECKSUM=$(cat $DMG_NAME.sha256)" >> $GITHUB_ENV
          
          # Clean up
          rm -rf "$STAGING_DIR"
          
          echo "✅ DMG created: $DMG_NAME"
          ls -la "$DMG_NAME"

      - name: Get tag message
        id: tag_message
        run: |
          # Fetch tag with annotation
          git fetch origin tag ${{ github.ref_name }} --force 2>/dev/null || true
          
          # Get message from annotated tag (skip first line which is tag name)
          TAG_MSG=$(git for-each-ref --format='%(contents:body)' refs/tags/${{ github.ref_name }} 2>/dev/null || echo "")
          
          # Output for next step
          {
            echo "message<<EOF"
            echo "$TAG_MSG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZendyKey-*.dmg
            ZendyKey-*.dmg.sha256
          body: |
            ## 🎉 ZendyKey v${{ steps.get_version.outputs.VERSION }}
            
            ${{ steps.tag_message.outputs.message }}
            
            ---
            
            ### 📋 Changelog
            
            ${{ steps.changelog.outputs.content }}
            
            ---
            
            ### 📥 Hướng dẫn cài đặt
            
            1. Tải file `ZendyKey-${{ steps.get_version.outputs.VERSION }}.dmg`
            2. Mở file DMG và kéo **ZendyKey** vào thư mục **Applications**
            3. Mở **System Settings** → **Privacy & Security** → **Accessibility**
            4. Bật quyền cho **ZendyKey**
            
            ### ⚠️ Lỗi "ZendyKey is damaged and can't be opened"
            
            Do app chưa được notarize bởi Apple (không cần Developer Account), macOS sẽ chặn app lần đầu. 
            
            **Cách khắc phục:** Mở Terminal và chạy:
            ```bash
            xattr -cr /Applications/ZendyKey.app
            ```
            
            Hoặc dùng [Homebrew](https://brew.sh):
            ```bash
            brew install --cask zendy199x/tap/zendykey
            ```
            
            ---
            
            **Checksum (SHA-256):**
            ```
            ${{ env.CHECKSUM }}
            ```
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
